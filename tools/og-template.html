<!DOCTYPE html>
<!-- 공유 미리보기 이미지(assets/og.png) 원본. 다시 만들 때: node tools/make-og.mjs -->
<html lang="ko"><head><meta charset="UTF-8"><style>
  body{margin:0;width:1200px;height:630px;background:#14213d;color:#fff;font-family:Pretendard,"Noto Sans CJK KR","Noto Sans KR",sans-serif;display:flex;flex-direction:column;justify-content:center;padding:0 90px;box-sizing:border-box;word-break:keep-all}
  .brand{display:flex;align-items:center;gap:22px;margin-bottom:44px}
  .logo{width:92px;height:92px;border-radius:24px;background:#1a4fd8;display:grid;place-items:center;font-size:52px;font-weight:800}
  .name{font-size:58px;font-weight:800;letter-spacing:-1px}
  h1{font-size:50px;line-height:1.35;margin:0 0 30px;font-weight:800;letter-spacing:-1px}
  h1 em{font-style:normal;color:#ffb020}
  p{margin:0;font-size:30px;color:#c9d2e4}
  .chips{display:flex;gap:14px;margin-top:40px}
  .chips span{border:2px solid #4a5878;border-radius:999px;padding:8px 22px;font-size:26px;color:#e6edff}
</style></head><body>
  <div class="brand"><div class="logo">길</div><div class="name">다시, 일 길잡이</div></div>
  <h1>관심 분야와 경력만 고르면<br><em>공고 찾는 검색어</em>부터 안내합니다</h1>
  <p>신중년 · 시니어 · 경력보유여성을 위한 관광분야 일자리 안내</p>
  <div class="chips"><span>채용공고</span><span>교육·자격</span><span>무료 상담</span><span>이번 주 할 일</span></div>
</body></html>
